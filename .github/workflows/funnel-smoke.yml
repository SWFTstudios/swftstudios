name: SWFT funnel smoke checks
on:
  pull_request:
    paths:
      - "index.html"
      - "campaigns/**"
      - "scripts/build-campaign-pages.mjs"
      - "js/funnel-attribution.js"
      - "css/conversion-funnel.css"
      - "tests/funnel/**"
      - "data/services.json"
      - "data/pricing.json"
      - "package.json"
      - "build.html"
      - "data/addons.json"
      - "data/builder-paths.json"
      - "data/site-search.json"
      - "js/cart.js"
      - "js/site-search.js"
      - "js/builder.js"
      - "js/swft-nav.js"
      - "functions/_lib/shop*.js"
      - "functions/api/checkout.js"
      - "scripts/build-site-search.mjs"
      - "scripts/build-service-pages.mjs"
      - "tests/commerce/**"
  workflow_dispatch:
jobs:
  verify-funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check funnel markup and CTAs
        run: npm run test:funnel
      - name: Verify generated campaign pages are up to date
        run: |
          npm run build:campaigns
          git diff --exit-code -- campaigns/
      - name: Verify indexed service pages regenerate with builder links and proof
        run: |
          npm run build:services
          git diff --exit-code -- websites.html apps.html software.html marketing.html content.html automations.html analytics.html
      - name: Verify server-side add-on pricing, builder and search index
        run: npm run test:commerce
      - name: Verify search index is generated from current data
        run: |
          npm run build:site-search
          git diff --exit-code -- data/site-search.json
