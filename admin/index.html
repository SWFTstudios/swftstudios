<!DOCTYPE html>
<html lang="en">
<head>
  <script id="swft-mode">(function(){var m;try{m=localStorage.getItem("swft-mode")}catch(e){}document.documentElement.setAttribute("data-mode",m==="light"||m==="system"?m:"dark")})();</script>
  <meta charset="utf-8">
  <title>Admin | SWFT Studios</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/swft-nav.css?v=20261105-r4">
  <link rel="stylesheet" href="/css/page-shell.css?v=20261105-r2">
  <link rel="stylesheet" href="/css/portal.css?v=20261110-notify">
  <link rel="stylesheet" href="/css/admin.css?v=20261111-auto">
  <link href="/images/favicon.webp" rel="shortcut icon" type="image/x-icon">
</head>
<body class="ps-page portal-page admin-page">
  <div id="swft-nav" data-active=""></div>
  <main>
    <div class="portal-shell portal-shell--wide admin-shell">
      <div class="portal-topbar">
        <header class="ps-hero ps-hero--left" style="margin-bottom:0;">
          <p class="ps-eyebrow">Owner dashboard</p>
          <h1 class="ps-title">Admin</h1>
          <p class="ps-lead" id="who">Checking your sign-in…</p>
        </header>
        <button type="button" class="portal-btn-ghost" id="logout-btn">Sign out</button>
      </div>

      <div id="gate-msg" class="portal-msg" hidden></div>

      <div id="app" hidden>
        <nav class="admin-tabs" role="tablist" aria-label="Admin sections">
          <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
          <button role="tab" data-tab="analytics" aria-selected="false">Analytics</button>
          <button role="tab" data-tab="clients" aria-selected="false">Projects</button>
          <button role="tab" data-tab="outreach" aria-selected="false">Outreach</button>
          <button role="tab" data-tab="guides" aria-selected="false">Guides</button>
          <button role="tab" data-tab="emails" aria-selected="false">Emails</button>
          <button role="tab" data-tab="newsletter" aria-selected="false">Newsletter</button>
          <button role="tab" data-tab="blog" aria-selected="false">Blog</button>
        </nav>
        <section id="tab-overview" class="admin-panel"></section>
        <section id="tab-analytics" class="admin-panel" hidden></section>
        <section id="tab-clients" class="admin-panel" hidden></section>
        <section id="tab-outreach" class="admin-panel" hidden></section>
        <section id="tab-guides" class="admin-panel" hidden></section>
        <section id="tab-emails" class="admin-panel" hidden></section>
        <section id="tab-newsletter" class="admin-panel" hidden></section>
        <section id="tab-blog" class="admin-panel" hidden></section>
      </div>
    </div>
  </main>
  <script src="/js/swft-nav.js?v=20261105-r4"></script>
  <script src="/js/portal.js?v=20260930b"></script>
  <script src="/js/portal-files.js?v=20261110-files"></script>
  <script src="/js/admin.js?v=20261111-autov"></script>
</body>
</html>
