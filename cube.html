<body class="cube-page">
  <div class="page-wrapper">
    <div id="swft-nav" data-active="our-work"></div>

    <main>
      <div class="cube-page-shell">
        <header class="cube-page-hero">
          <p class="cube-page-eyebrow">SWFT Studios</p>
          <h1 class="cube-page-title">Six sides of the work</h1>
          <p class="cube-page-lead">A cube of our work, hovering over open water under a single spotlight. Drag or swipe to spin it, tap a photo to flip through it, or hover to tilt.</p>
        </header>
      </div>

      <section class="swft-ocean" data-swft-ocean aria-label="Work cube over the ocean">
        <div class="swft-cube" data-swft-cube data-spin="14" data-slide-interval="3200" tabindex="0" role="region" aria-roledescription="3D image cube" aria-label="SWFT Studios work cube">
          <div class="swft-cube__scene">
            <div class="swft-cube__body">
              <div data-face="front" data-label="Websites">
                <img class="swft-cube__slide" src="images/thyme-and-table-thumbnail-p-800.webp" alt="Thyme and Table website" loading="eager" decoding="async">
                <img class="swft-cube__slide" src="images/mayim-spa-thumbnail.webp" alt="Mayim Spa website" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/tal-hydration-thumbnail-p-800.webp" alt="TAL Hydration website" loading="lazy" decoding="async">
              </div>
              <div data-face="right" data-label="Brands">
                <img class="swft-cube__slide" src="images/manna-hydration-thumbnail-p-800.webp" alt="Manna Hydration website" loading="eager" decoding="async">
                <img class="swft-cube__slide" src="images/alpha-ministries-thumbnail-p-800.webp" alt="Alpha Ministries website" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/hamper_app_website_thumbnail-p-800.webp" alt="Hamper app website" loading="lazy" decoding="async">
              </div>
              <div data-face="back" data-label="Content">
                <img class="swft-cube__slide" src="images/Roller_Reels_thumbnail-p-800.webp" alt="Roller Reels production" loading="eager" decoding="async">
                <img class="swft-cube__slide" src="images/BLE_SWFT_thumbnail-p-800.webp" alt="Blurred Lines Entertainment production" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/brooklyn-steel-thumbnail-p-800.webp" alt="Brooklyn Steel project" loading="lazy" decoding="async">
              </div>
              <div data-face="left" data-label="Industries">
                <img class="swft-cube__slide" src="images/doctor-p-800.webp" alt="Healthcare practice" loading="eager" decoding="async">
                <img class="swft-cube__slide" src="images/real-estate-p-800.webp" alt="Real estate" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/e-commerce-p-800.webp" alt="E-commerce" loading="lazy" decoding="async">
              </div>
              <div data-face="top" data-label="Messaging">
                <img class="swft-cube__slide" src="images/Website-Chatbot-Lifestyle-p-800.webp" alt="Website chatbot in use" loading="eager" decoding="async">
                <img class="swft-cube__slide" src="images/Whatsapp-Lifestyle-Photo-p-800.webp" alt="WhatsApp messaging" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/IG-FB-Messenger-Lifestlye-p-800.webp" alt="Instagram and Messenger inbox" loading="lazy" decoding="async">
              </div>
              <div data-face="bottom" data-label="Studio">
                <img class="swft-cube__slide" src="images/swft-thumbnail-p-800.webp" alt="SWFT Studios website" loading="eager" decoding="async">
                <img class="swft-cube__slide" src="images/Snooze-Lane-Desktop-thumbnail-p-800.webp" alt="Snooze Lane website" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/built_by_me_ez_thumbnail-p-800.webp" alt="Built By Me EZ website" loading="lazy" decoding="async">
                <img class="swft-cube__slide" src="images/Personal-Trainer-p-800.webp" alt="Personal trainer" loading="lazy" decoding="async">
              </div>
            </div>
          </div>
        </div>
      </section>
