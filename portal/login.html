<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In: Client Portal | SWFT Studios</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sign in to your SWFT Studios client portal.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/swft-nav.css?v=20261027-mono2">
  <link rel="stylesheet" href="/css/portal.css?v=20261027-ws">
  <link href="/images/favicon.webp" rel="shortcut icon" type="image/x-icon">
</head>
<body class="mf-page pt-auth">
  <div id="swft-nav" data-active=""></div>
  <main id="main">
    <section class="mf-hero mf-hero--page" aria-labelledby="pt-title">
      <div class="mf-wrap mf-split">
        <div>
          <div class="mf-hero__top"><p class="mf-label">(Client portal)</p></div>
          <h1 class="mf-h1" id="pt-title">Welcome <span class="mf-script">back.</span></h1>
          <p class="mf-lead">Upload files, share links, leave notes and see where your project stands. <span class="is-muted">SWFT team members sign in here too.</span></p>
        </div>
        <div class="pt-card">
          <form id="login-form" class="mf-form" novalidate>
            <div class="mf-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="mf-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
            <p id="form-msg" class="pt-msg" hidden></p>
            <div class="mf-actions"><button type="submit" class="mf-btn">Sign in <span class="mf-arrow" aria-hidden="true">↗</span></button></div>
          </form>
          <div class="pt-card__foot"><a href="/portal/forgot.html">Forgot password?</a><span>New client? Use the link in your invite email.</span></div>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/swft-nav.js?v=20261027-mono"></script>
  <script src="/js/portal.js?v=20261027-ws"></script>
  <script>
    (function () {
      var P = SWFTPortal;
      // Already signed in? Go straight to the right dashboard.
      P.api("/api/portal/session").then(function (r) {
        if (r.res.ok && r.data.ok) location.replace(r.data.user.admin ? "/portal/admin.html" : "/portal/dashboard.html");
      });
      P.qs("#login-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var msg = P.qs("#form-msg");
        var btn = this.querySelector("button");
        btn.disabled = true;
        P.showMsg(msg, "Signing in…");
        var r = await P.api("/api/portal/login", { method: "POST", body: JSON.stringify({ email: P.qs("#email").value.trim(), password: P.qs("#password").value }) });
        btn.disabled = false;
        if (!r.res.ok || !r.data.ok) return P.showMsg(msg, (r.data && r.data.error) || "Sign in failed.", "error");
        // Only follow ?next= to this site's own dashboards
        var next = P.params().get("next");
        var ok = next && /^\/portal\/(dashboard|admin)(\.html)?(#[\w=&-]*)?$/.test(next) && (/admin/.test(next) === !!r.data.admin);
        location.href = ok ? next : r.data.redirect || "/portal/dashboard.html";
      });
    })();
  </script>
</body>
</html>
